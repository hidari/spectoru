[package]
name = "spectoru"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Visualize tests as living specifications: a static-site generator for Rust and Vitest test suites."
readme = "../../README.md"
keywords = ["test", "specification", "documentation", "static-site"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_derive / thiserror-impl が使う版に合わせる。ここだけ 2 系にすると
# ビルドグラフに syn が二重に載る。
syn = { version = "3", features = ["full", "parsing"] }
# syn の Span から行番号を取るために必要。span-locations 無しでは
# `Span::start()` が常に 0 を返し、サイトからソースへ辿れなくなる。
proc-macro2 = { version = "1", features = ["span-locations"] }
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
toml = "1"
# ripgrep 由来の .gitignore 対応ウォーカー。
ignore = "0.4"
# エポック秒から暦日への変換のみに使う。閏年の扱いを自作する価値はない。
time = "0.3"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
